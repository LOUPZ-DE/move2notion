<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Automatisierte Migration von Microsoft 365-Daten nach Notion">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Move2Notion">
    <title>{% block title %}MS &rarr; Notion Migration{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="navbar-brand">
                <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="m2n" class="navbar-logo">
                <span>move2notion</span>
            </a>
            {% if session.authenticated %}
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Dashboard</a>
                <a href="{{ url_for('onenote_dashboard') }}">OneNote</a>
                <a href="{{ url_for('planner_dashboard') }}">Planner</a>
                <a href="{{ url_for('overview_dashboard') }}">Overview</a>
                <span id="active-tasks-badge" class="active-tasks-badge" style="display:none;" title="Laufende Migrationen"></span>
                <a href="{{ url_for('logout') }}" class="logout">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>MS → Notion Migration Tool | <a href="https://github.com" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(function() {});
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
